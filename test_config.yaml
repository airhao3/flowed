# Logging configuration
logging:
  level: "DEBUG"
  file: "logs/flowed_test.log"
  max_size: 10
  backup_count: 5
  structured: false
  console: true

# Data collection configuration
data:
  source: "pcap"
  pcap:
    input_dir: "data/raw"
    file_pattern: "*.pcap*"

# Data ingestion configuration
data_ingestion:
  processors:
    pcap:
      display_filter: "tcp or udp"
      max_packets: 5000
      batch_size: 1000
      skip_malformed: true
      min_packet_size: 14
      max_packet_size: 65535

# Feature extraction configuration
features:
  calculators:
    # Existing calculators
    flow:
      enabled: true
    session:
      enabled: false
      small_packet_threshold: 64
    host:
      enabled: true
      time_window: '5s'
    packet:
      enabled: true
    http:
      enabled: true
    dns:
      enabled: true
    tls:
      enabled: true
    ssh:
      enabled: true
    sql:
      enabled: true

    # Newly added calculators
    network_security:
      enabled: true
    protocol_anomaly:
      enabled: true
    temporal:
      enabled: true
      time_windows: [1, 5, 10, 60]  # in seconds
    payload:
      enabled: false
    dga:
      enabled: false
      dga_threshold: 1.0

  # Data quality and preprocessing controls
  quality_control:
    enabled: true
    validate_ips: true
    validate_ports: true
    clip_outliers:
      enabled: true
      quantile: 0.99

  # Feature selection and filtering
  feature_selection:
    remove_low_variance: true
    variance_threshold: 0.01
    remove_highly_correlated: true
    correlation_threshold: 0.95

# Model configuration
model:
  type: "isolation_forest"
  name: "isolation_forest_model"
  save_dir: "data/models"
  threshold: 0.65
  params:
    n_estimators: 100
    max_samples: 'auto'
    contamination: 0.05
    random_state: 42
  train:
    force_retrain: true
    min_samples: 200
    validation_split: 0.1

# Output configuration
output:
  report_dir: "data/reports"
  processed_data_dir: "data/processed"
  save_processed_data: true

# Visualization configuration
visualization:
  output_dir: "data/reports"
  plots:
    traffic_volume: true
    protocol_distribution: true
    top_talkers: true
    anomaly_scores: true
  report:
    template: "default"
    include_summary: true
    include_anomalies: true
    include_visualizations: true
